[mod-name]
wood-still-burns=Wood Still Burns

[mod-description]
wood-still-burns=Gives wooden chests and small electric poles a fuel value derived from the wood in their recipes.

[mod-setting-name]
wood-still-burns-energy-recovery-rate=Energy recovery rate

[mod-setting-description]
wood-still-burns-energy-recovery-rate=Fraction of the wood's fuel value recovered by burning the crafted item, from 0 to 1. 0 disables fuel values. The fuel value is the wood's fuel value times the wood used in the recipe, divided by the number of items crafted, times this rate.
