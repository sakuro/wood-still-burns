[mod-name]
wood-still-burns=Wood Still Burns

[mod-description]
wood-still-burns=木製チェストと小型電柱に、レシピで使われる木材から算出した熱量を設定します。

[mod-setting-name]
wood-still-burns-energy-recovery-rate=エネルギー回収率

[mod-setting-description]
wood-still-burns-energy-recovery-rate=製作したアイテムを燃やしたときに回収できる木材の熱量の割合(0〜1)。0にすると熱量を設定しません。熱量は、木材の熱量 × レシピの木材数 ÷ 製作個数 × この回収率です。
