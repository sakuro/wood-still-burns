[mod-name]
wood-still-burns=Wood Still Burns

[mod-description]
wood-still-burns=木箱と小型電柱に、レシピで使われる木材から算出した燃料値を設定します。

[mod-setting-name]
wood-still-burns-energy-recovery-rate=エネルギー回収率

[mod-setting-description]
wood-still-burns-energy-recovery-rate=製作したアイテムを燃やしたときに回収できる木材の燃料値の割合(0〜1)。0にすると燃料値を設定しません。燃料値は、木材の燃料値 × レシピの木材数 ÷ 製作個数 × この回収率です。
